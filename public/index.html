<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager DevOps</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>Task Manager DevOps</h1>
    <p>Gestor de tareas con Node.js, Express y SQLite</p>

    <div class="task-form">
      <input
        type="text"
        id="taskInput"
        placeholder="Escribe una nueva tarea"
      >
      <button id="addTaskBtn">Agregar tarea</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
