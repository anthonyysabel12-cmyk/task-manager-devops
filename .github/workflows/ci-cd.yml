name: CI/CD Task Manager

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm install

      - name: Analisis estatico con ESLint
        run: npx eslint src tests

      - name: Ejecutar pruebas
        run: npm test

      - name: Construir imagen Docker
        run: docker build -t task-manager-devops .

      - name: Iniciar sesion en Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Construir y publicar imagen en Docker Hub
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: anthony12dr/task-manager-devops:latest

      - name: Desplegar en Render
        if: github.event_name == 'push'
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"